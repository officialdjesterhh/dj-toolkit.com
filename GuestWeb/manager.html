<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJToolkit Remote Manager</title>
<style>body{margin:0;background:#050812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#0d1425;border:1px solid #24324d;border-radius:20px;padding:18px;margin:14px 0}.hero{font-size:34px;font-weight:900}.cyan{color:#22d3ee}.row{display:flex;gap:12px;flex-wrap:wrap}.metric{flex:1;min-width:130px;background:#080d19;border-radius:14px;padding:14px}.value{font-size:28px;font-weight:900}.muted{color:#94a3b8;font-size:13px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#15304a;color:#67e8f9;font-weight:700}button{background:linear-gradient(90deg,#22d3ee,#a855f7);border:0;border-radius:12px;padding:12px 16px;font-weight:800}</style></head>
<body><main class="wrap"><div class="hero">DJ<span class="cyan">Toolkit</span> Remote</div><p class="muted">Venue Staff / zweites Gerät · Live Event Status</p><div id="status" class="badge">Verbinde …</div><section class="card"><div class="row"><div class="metric"><div class="muted">BPM</div><div id="bpm" class="value">—</div></div><div class="metric"><div class="muted">KEY</div><div id="key" class="value">—</div></div><div class="metric"><div class="muted">ENERGY</div><div id="energy" class="value">—</div></div></div></section><section class="card"><div class="muted">CURRENT TRACK</div><h2 id="track">—</h2><div class="muted">REQUESTS</div><h2 id="requests">0</h2><div id="announcement"></div></section><button onclick="load()">Aktualisieren</button></main>
<script>const eventID=new URLSearchParams(location.search).get('event');async function load(){if(!eventID){document.getElementById('status').textContent='Event-ID fehlt';return}try{const r=await fetch(`/api/events/${encodeURIComponent(eventID)}/remote-state`,{cache:'no-store'});const x=await r.json();if(!x){document.getElementById('status').textContent='Noch kein Live-Status';return}document.getElementById('status').textContent=`Live · ${x.deviceName||'Device'}`;document.getElementById('bpm').textContent=x.bpm?Number(x.bpm).toFixed(1):'—';document.getElementById('key').textContent=x.musicalKey||'—';document.getElementById('energy').textContent=x.energy?Number(x.energy).toFixed(1):'—';document.getElementById('track').textContent=x.currentTrack||'—';document.getElementById('requests').textContent=x.requestCount||0;document.getElementById('announcement').textContent=x.announcement?`📣 ${x.announcement}`:''}catch(e){document.getElementById('status').textContent='Offline'}}load();setInterval(load,5000)</script><footer id="manager-legal-v301" style="max-width:760px;margin:24px auto 34px;padding:0 16px;text-align:center;color:#68758e;font:10px -apple-system,BlinkMacSystemFont,system-ui,sans-serif"><a href="/impressum.html" style="color:inherit;text-decoration:none">Impressum</a> · <a href="/datenschutz.html" style="color:inherit;text-decoration:none">Datenschutz</a> · <a href="/agb.html" style="color:inherit;text-decoration:none">AGB</a> · <a href="/rechtswidrige-inhalte.html" style="color:inherit;text-decoration:none">Inhalte melden</a></footer></body></html>
