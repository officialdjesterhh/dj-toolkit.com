<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DJ Toolkit · Passwort zurücksetzen</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070d;color:#f6f8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px;background-image:radial-gradient(circle at 15% 0,rgba(39,210,255,.14),transparent 32rem),radial-gradient(circle at 100% 0,rgba(185,71,255,.13),transparent 30rem)}
    main{width:min(520px,100%);padding:30px;border:1px solid #243049;border-radius:26px;background:rgba(11,17,29,.94);box-shadow:0 30px 90px rgba(0,0,0,.35)}h1{font-size:32px;margin:8px 0}.eye{font-size:10px;letter-spacing:.17em;font-weight:900;color:#6adfff}.muted{color:#aab7cc;line-height:1.6}label{font-size:12px;font-weight:800;color:#cbd4e4}input{width:100%;margin:7px 0 16px;padding:14px;border-radius:13px;border:1px solid #2b3850;background:#090f1b;color:#fff;font:inherit}button{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(105deg,#168fff,#785bff 68%,#b952ff);color:#fff;font-weight:900;cursor:pointer}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#101827;color:#bcd0e8;font-size:13px}.msg.show{display:block}.ok{color:#7df0b4}.err{color:#ff9bab}
  </style>
</head>
<body><main><div class="eye">DJ TOOLKIT ACCOUNT</div><h1>Neues Passwort</h1><p class="muted">Lege ein neues Passwort mit mindestens 10 Zeichen fest. Der Reset-Link ist nur begrenzt gültig.</p><form id="form"><label for="pw">Neues Passwort</label><input id="pw" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><label for="pw2">Passwort wiederholen</label><input id="pw2" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><button type="submit">Passwort aktualisieren</button></form><div id="msg" class="msg"></div></main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';const form=document.getElementById('form'),msg=document.getElementById('msg');function show(text,ok=false){msg.textContent=text;msg.className='msg show '+(ok?'ok':'err')}
if(!token){show('Der Reset-Link ist unvollständig oder ungültig.');form.querySelector('button').disabled=true}
form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('pw').value,b=document.getElementById('pw2').value;if(a!==b)return show('Die Passwörter stimmen nicht überein.');if(a.length<10)return show('Bitte mindestens 10 Zeichen verwenden.');const button=form.querySelector('button');button.disabled=true;try{const response=await fetch('/api/auth/password-reset/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:a})});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'Reset fehlgeschlagen');show('Passwort erfolgreich geändert. Du kannst dich jetzt in DJToolkit anmelden.',true);form.reset()}catch(error){show(error.message||'Reset fehlgeschlagen');button.disabled=false}})
</script><footer id="reset-legal-v301" style="max-width:520px;margin:22px auto 36px;padding:0 18px;text-align:center;color:#667288;font:10px -apple-system,BlinkMacSystemFont,system-ui,sans-serif"><p>Beim Passwort-Reset werden E-Mail-Adresse und eine zeitlich begrenzte Reset-Kennung verarbeitet. <a href="/datenschutz.html" style="color:#8edfff">Datenschutz</a></p><a href="/impressum.html" style="color:#7e8ba1;text-decoration:none">Impressum</a> · <a href="/datenschutz.html" style="color:#7e8ba1;text-decoration:none">Datenschutz</a> · <a href="/agb.html" style="color:#7e8ba1;text-decoration:none">AGB</a> · <a href="/rechtswidrige-inhalte.html" style="color:#7e8ba1;text-decoration:none">Inhalte melden</a></footer></body></html>
